version: "3.8" # Updated version
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - FRAPPE_BIND_ADDR=0.0.0.0
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - UV_INDEX_URL=https://mirrors.cernet.edu.cn/pypi/web/simple
      - PIP_INDEX_URL=https://mirrors.cernet.edu.cn/pypi/web/simple
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - ./mariadb-client-no-ssl.cnf:/etc/mysql/conf.d/99-no-ssl.cnf:ro
      - ../.bench-cache:/cache
      - frappe-home:/home/frappe
    ports:
      - 8000:8000
      - 9100:9000

volumes:
  mariadb-data:
  frappe-home:
